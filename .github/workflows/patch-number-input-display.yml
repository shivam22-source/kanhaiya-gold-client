name: Fix number input display

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix number input display') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch numeric input display
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('client/src/pages/MobileDashboard.jsx')
          text = path.read_text(encoding='utf-8')
          old = "        value={value ?? ''}"
          new = "        value={type === 'number' && Number(value) === 0 ? '' : (value ?? '')}"
          if old not in text:
              raise SystemExit('Expected numeric input line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove patch workflow
        run: rm -f .github/workflows/patch-number-input-display.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/MobileDashboard.jsx .github/workflows/patch-number-input-display.yml
          git commit -m "Fix number input display" || exit 0
          git push