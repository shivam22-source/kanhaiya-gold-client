name: Kanhaiya Gold Backup

on:
  schedule:
    # Daily database backup: 02:30 IST (21:00 UTC previous day)
    - cron: '0 21 * * *'
    # Weekly database + Cloudinary image backup: Sunday 02:30 IST
    - cron: '0 21 * * 0'
  workflow_dispatch:
    inputs:
      backup_images:
        description: 'Also back up Cloudinary images now'
        required: false
        default: 'false'
        type: boolean

env:
  # The Sunday schedule automatically includes Cloudinary images.
  BACKUP_IMAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.backup_images || github.event.schedule == '0 21 * * 0' && 'true' || 'false' }}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Run backup
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_OAUTH_REDIRECT_URI: ${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          BACKUP_IMAGES: ${{ env.BACKUP_IMAGES }}
        run: npm run backup
