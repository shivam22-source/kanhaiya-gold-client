services:
  postgres:
    image: postgres:16
    container_name: gold-appraiser-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gold_appraiser
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - gold_appraiser_data:/var/lib/postgresql/data

volumes:
  gold_appraiser_data:
