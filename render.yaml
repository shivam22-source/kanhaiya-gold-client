services:
  - type: web
    name: kanhaiya-gold-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: kanhaiya-gold-db
          property: connectionString
      - key: CLIENT_ORIGIN
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: IBJA_RATES_API_URL
        sync: false
      - key: IBJA_RATES_API_KEY
        sync: false

  - type: pg
    name: kanhaiya-gold-db
    plan: free
    databaseName: gold_appraiser
    user: gold_appraiser
